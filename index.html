<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LifeLog</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="icon" href="icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#121212">
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, system-ui, sans-serif;
      margin: 0;
      padding: 12px 14px 90px;
      background: #f5f5f5;
      color: #1a1a1a;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #121212; color: #eee; }
      .card, .panel { background: #1e1e1e !important; }
      input, textarea, select { background: #1e1e1e; color: #eee; border-color: #444 !important; }
      .day-header { color: #aaa !important; }
    }
    h1 { font-size: 20px; margin: 4px 0 12px; }
    .hidden { display: none !important; }
    .panel {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.08);
    }
    label { display: block; font-size: 13px; color: #888; margin-bottom: 4px; }
    input[type="email"], textarea {
      width: 100%;
      font-size: 16px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-family: inherit;
    }
    textarea { min-height: 100px; resize: vertical; }
    button {
      font-size: 15px;
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      background: #1e88e5;
      color: white;
      cursor: pointer;
    }
    button.secondary { background: #555; }
    button.danger { background: #c62828; }
    button:disabled { opacity: 0.5; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .status-msg { font-size: 13px; color: #888; margin-top: 8px; }
    #sync-banner {
      position: fixed;
      top: 0; left: 0; right: 0;
      background: #f9a825;
      color: #1a1a1a;
      padding: 8px 14px;
      font-size: 13px;
      text-align: center;
      z-index: 100;
    }
    #tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    #tabs button { flex: 1; background: #ddd; color: #333; }
    #tabs button.active { background: #1e88e5; color: white; }
    @media (prefers-color-scheme: dark) {
      #tabs button { background: #2a2a2a; color: #ccc; }
    }
    .photo-thumbs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .photo-thumb { position: relative; width: 72px; height: 72px; }
    .photo-thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }
    .photo-thumb .remove {
      position: absolute; top: -6px; right: -6px;
      width: 22px; height: 22px; border-radius: 50%;
      background: #c62828; color: white; border: none;
      font-size: 12px; line-height: 1; padding: 0;
    }
    .day-header {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #666;
      margin: 18px 0 8px;
    }
    .card {
      background: white;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.08);
    }
    .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .tag {
      font-size: 11px; font-weight: 600; color: white;
      padding: 2px 8px; border-radius: 999px; text-transform: uppercase;
    }
    .time { font-size: 12px; color: #888; }
    .text { font-size: 15px; line-height: 1.4; }
    .meta { font-size: 12px; color: #888; margin-top: 4px; }
    .edited-badge { font-size: 11px; color: #f9a825; margin-left: 6px; }
    .empty { color: #888; font-size: 14px; }
  </style>
</head>
<body>
  <div id="sync-banner" class="hidden"></div>
  <h1>LifeLog</h1>

  <!-- Auth gate -->
  <div id="auth-panel" class="panel hidden">
    <label for="email-input">Sign in with email</label>
    <input type="email" id="email-input" placeholder="you@example.com" autocomplete="email">
    <div class="row">
      <button id="send-link-btn">Send magic link</button>
    </div>
    <div id="auth-status" class="status-msg"></div>
  </div>

  <!-- Main app -->
  <div id="app" class="hidden">
    <div id="tabs">
      <button id="tab-log" class="active">Log</button>
      <button id="tab-history">History</button>
    </div>

    <div id="view-log">
      <div class="panel">
        <label for="entry-text">Entry</label>
        <textarea id="entry-text" placeholder="Type, or tap the mic on the keyboard to dictate..."></textarea>
        <div class="row">
          <button id="cleanup-btn" class="secondary">Clean up dictation</button>
          <button id="photo-btn" class="secondary">Add photo</button>
        </div>
        <input type="file" id="photo-input" accept="image/*" capture="environment" multiple class="hidden">
        <div id="photo-thumbs" class="photo-thumbs"></div>
        <label style="margin-top:12px;"><input type="checkbox" id="on-flight-check"> I'm on a flight (no location/weather)</label>
        <div class="row">
          <button id="submit-btn">Log it</button>
        </div>
        <div id="log-status" class="status-msg"></div>
      </div>
    </div>

    <div id="view-history" class="hidden">
      <div class="row" style="margin-bottom: 10px;">
        <select id="days-filter">
          <option value="1">1d</option>
          <option value="3" selected>3d</option>
          <option value="7">7d</option>
          <option value="14">14d</option>
          <option value="30">30d</option>
        </select>
      </div>
      <div id="history-content">Loading…</div>
    </div>

    <div class="row" style="margin-top:20px;">
      <button id="sign-out-btn" class="secondary">Sign out</button>
    </div>
  </div>

  <div id="app-version" style="position:fixed;bottom:2px;right:6px;font-size:10px;color:#888;z-index:50;"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
